
name: Build Squeak APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SqueakAndroid_source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip SqueakAndroid_source.zip -d .

      - name: Build APK
        run: gradle -p SqueakAndroid assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Squeak-debug-APK
          path: SqueakAndroid/app/build/outputs/apk/debug/app-debug.apk
          
